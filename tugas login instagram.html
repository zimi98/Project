<!DOCTYPE html>
<html>
<head>
    <title>Log into Instagram - Tugas 3 HTML</title>
</head>
<body bgcolor="#121212" text="#ffffff">

    <table width="100%" height="100%" border="0" cellpadding="20" cellspacing="0">
        <tr valign="middle">
            <!-- Kolom Kiri: Branding -->
            <td width="50%" align="center">
                <table border="0" cellpadding="10" cellspacing="0" width="80%">
                    <tr>
                        <td align="center">
                            <img src="https://static.cdninstagram.com/rsrc.php/yO/r/Ny6hrBVLYjl.webp" alt="Instagram Logo" width="60">
                        </td>
                    </tr>
                    <tr>
                        <td align="center">
                            <h1>See everyday moments from your <font color="#e1306c">close friends</font>.</h1>
                        </td>
                    </tr>
                    <tr>
                        <td align="center">
                            <img src="https://static.cdninstagram.com/rsrc.php/yJ/r/53X3pk-t2Gn.webp" alt="Close Friends Showcase" width="300">
                        </td>
                    </tr>
                </table>
            </td>

            <!-- Pembatas Tengah -->
            <td width="1" bgcolor="#262626"></td>

            <!-- Kolom Kanan: Form Login -->
            <td width="50%" align="center">
                <table border="0" cellpadding="8" cellspacing="0" width="350">
                    <tr>
                        <td align="left">
                            <h2>Log into Instagram</h2>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <form action="#" method="post">
                                <table border="0" cellpadding="8" cellspacing="0" width="100%">
                                    <tr>
                                        <td>
                                            <input type="text" name="username" placeholder="Mobile number, username or email" size="40">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <input type="password" name="password" placeholder="Password" size="40">
                                        </td>
                                    </tr>
                                    
                                    <!-- Tombol Log In (Simulasi Tombol Kustom dengan Tabel) -->
                                    <tr>
                                        <td align="center" bgcolor="#0064e0">
                                            <a href="#" style="text-decoration:none;">
                                                <font color="#ffffff" size="3"><b>Log in</b></font>
                                            </a>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td align="center">
                                            <a href="#"><font color="#a8a8a8" size="2">Forgot password?</font></a>
                                        </td>
                                    </tr>

                                    <!-- Tombol Log in with Facebook -->
                                    <tr>
                                        <td align="center" bgcolor="#262626">
                                            <a href="#" style="text-decoration:none;">
                                                <font color="#ffffff" size="3"><b>&#128100; Log in with Facebook</b></font>
                                            </a>
                                        </td>
                                    </tr>

                                    <!-- Tombol Create new account -->
                                    <tr>
                                        <td align="center" bgcolor="#121212">
                                            <table border="1" borderColor="#0095f6" cellpadding="6" cellspacing="0" width="100%">
                                                <tr>
                                                    <td align="center">
                                                        <a href="#" style="text-decoration:none;">
                                                            <font color="#0095f6" size="3"><b>Create new account</b></font>
                                                        </a>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td align="center">
                                            <br>
                                            <font color="#8e8e8e" size="2"><b>&infin; Meta</b></font>
                                        </td>
                                    </tr>
                                </table>
                            </form>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
